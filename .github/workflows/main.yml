name: Java CI

on:
  push:
    branches: ['7.x']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Maven Central'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build extension
        run: mvn -B -e clean verify

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: orm-lex
          # the lite .lex resolves its libraries from Maven, where the -SNAPSHOT is not published, so test the full .lex
          path: |
            target/*.lex
            !target/*.lite.lex

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            lucee: '7.0/snapshot/light'
          - java: '21'
            lucee: '7.1/snapshot/light'
          - java: '25'
            lucee: '7.1/snapshot/light'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lucee
          MYSQL_USER: lucee
          MYSQL_PASSWORD: lucee
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      sql-server:
        image: ghcr.io/lucee/mssql-server:test-mirror
        env:
          MSSQL_PID: Express
          ACCEPT_EULA: Y
          SA_PASSWORD: Lucee!1433
        ports:
          - 1433:1433
        options: --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P ${SA_PASSWORD} -Q 'SELECT 1' || exit 1"  --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lucee
          POSTGRES_USER: lucee
          POSTGRES_PASSWORD: lucee
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lucee"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Cache Lucee files
        uses: actions/cache@v5
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: orm-lex
          path: target

      - name: Checkout Lucee
        uses: actions/checkout@v6
        with:
          repository: lucee/lucee
          path: lucee

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/
          execute: /test/bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: orm
          testAdditional: ${{ github.workspace }}/tests
          testServices: mysql,mssql,postgres
          MYSQL_SERVER: localhost
          MYSQL_USERNAME: lucee
          MYSQL_PASSWORD: lucee
          MYSQL_PORT: 3306
          MYSQL_DATABASE: lucee
          MSSQL_SERVER: localhost
          MSSQL_USERNAME: sa
          MSSQL_PASSWORD: Lucee!1433
          MSSQL_PORT: 1433
          MSSQL_DATABASE: master
          POSTGRES_SERVER: localhost
          POSTGRES_USERNAME: lucee
          POSTGRES_PASSWORD: lucee
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: lucee

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test]
    # DISABLED — guarded against accidental deploys. To re-enable, restore:
    #   if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/5.6'
    if: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml
        # in org/lucee/hibernate-extension/; Central then rejects the bundle
        # ("Bundle has content that does NOT have a .pom file"). Pin 3.9.16 for the deploy.
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      - name: Build and Deploy with Maven
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot -------";
            mvn -B -e clean deploy --settings maven-settings.xml
          elif [[ "$VERSION" == *-ALPHA ]]; then
            echo "------- Maven Install alpha -------";
            mvn -B -e clean install --settings maven-settings.xml
          else
            echo "------- Maven Deploy release -------";
            mvn -B -e clean deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # LDEV-6685: the published .lex files (full and lite) for the github-release job
      - name: Upload artifact for GitHub release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hibernate-release
          path: target/*.lex

  # LDEV-6685: publish every final, BETA and RC build as a GitHub release with its .lex files attached,
  # so ext.lucee.org can redirect downloads to GitHub releases (LDEV-6511). -SNAPSHOT and ALPHA builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central deploy.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, deploy]
    # ALPHA builds are not published (the deploy job only runs mvn install), so they get no GitHub release either
    if: >-
      always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !endsWith(needs.build.outputs.version, '-SNAPSHOT')
      && !endsWith(needs.build.outputs.version, '-ALPHA')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the files the deploy job built and published
      - name: Download published extension
        uses: actions/download-artifact@v4
        with:
          name: hibernate-release
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (5.6.15.21 or 5.6.15.21-RC), created on this commit
          # if it does not exist yet. BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi
