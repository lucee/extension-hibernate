name: Java CI Combined

# Push publishes the -SNAPSHOT version already in pom.xml to the Sonatype snapshot repo (and S3, until the cut-off).
# A manual run picks a type: release (default) X.Y.Z.N, rc X.Y.Z.N-RC, beta X.Y.Z.N-BETA, alpha X.Y.Z.N-ALPHA
# (N from the -SNAPSHOT in pom.xml), then commits the next -SNAPSHOT. Type "snapshot" only deploys the current snapshot.
# Where each version goes:
#   final (X.Y.Z.N) and -SNAPSHOT: mvn deploy (Maven Central / snapshot repo) + S3 Maven layout
#   -RC, -BETA, -ALPHA:            mvn install (signed), S3 Maven layout only (maven.lucee-services.com), never Central
# A push to a branch with a -SNAPSHOT version also commits the next -SNAPSHOT after the deploy,
# so every commit gets its own build number. The bump commit itself does not bump again.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      type:
        description: 'What to publish: release (X.Y.Z.N), rc (-RC), beta (-BETA), alpha (-ALPHA), or snapshot (deploy the current -SNAPSHOT, no bump)'
        type: choice
        options:
          - release
          - rc
          - beta
          - alpha
          - snapshot
        default: release

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      release: ${{ steps.extract-version.outputs.RELEASE }}
      next_version: ${{ steps.extract-version.outputs.NEXT_VERSION }}
      lucee_matrix: ${{ steps.lucee-matrix.outputs.MATRIX }}
      publish: ${{ steps.publish.outputs.PUBLISH }}
    steps:
      # Only pushes and manual runs on master/main, a version branch (1.0, 2.0, 7.x, ...) or release/* may
      # publish (deploy, s3) or commit (bump). Feature and PR branches only build and test.
      - name: Decide whether this run may publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          PUBLISH=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" ]]; then
            BRANCH="${REF#refs/heads/}"
            if [[ "$REF" == refs/heads/* ]] && [[ "$BRANCH" == "master" || "$BRANCH" == "main" || "$BRANCH" =~ ^[0-9]+(\.[0-9]+)*(\.x)?$ || "$BRANCH" == release/* ]]; then
              PUBLISH=true
            fi
          fi
          echo "event=${EVENT} ref=${REF} publish=${PUBLISH}"
          echo "PUBLISH=${PUBLISH}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        env:
          # A manual run publishes the picked type. Push and pull_request always use the -SNAPSHOT in pom.xml.
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.type || 'snapshot' }}
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
          RELEASE=false
          NEXT_VERSION=""
          case "$RELEASE_TYPE" in
            release) SUFFIX="" ;;
            rc) SUFFIX="-RC" ;;
            beta) SUFFIX="-BETA" ;;
            alpha) SUFFIX="-ALPHA" ;;
            snapshot) SUFFIX="none" ;;
            *) echo "::error::unknown release type [${RELEASE_TYPE}]"; exit 1 ;;
          esac
          if [[ "$SUFFIX" != "none" ]]; then
            if [[ "$VERSION" != *-SNAPSHOT ]]; then
              echo "::error::A release run needs a -SNAPSHOT version in pom.xml (found ${VERSION})"
              exit 1
            fi
            RELEASE_VERSION="${VERSION%-SNAPSHOT}"
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
              echo "::error::[${RELEASE_VERSION}] is not a 4-part release version"
              exit 1
            fi
            PREFIX="${RELEASE_VERSION%.*}"
            LAST="${RELEASE_VERSION##*.}"
            NEXT_VERSION="${PREFIX}.$((10#$LAST + 1))-SNAPSHOT"
            VERSION="${RELEASE_VERSION}${SUFFIX}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}(-RC|-BETA|-ALPHA)?$ ]]; then
              echo "::error::[${VERSION}] is not a valid release version"
              exit 1
            fi
            RELEASE=true
            echo "Release run: publish ${VERSION}, then bump pom.xml to ${NEXT_VERSION}"
          fi
          echo "Using VERSION=${VERSION} RELEASE=${RELEASE} NEXT_VERSION=${NEXT_VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # Repository and organization variables are not passed to pull_request runs from forks, so
      # vars.LUCEE_TEST_VERSIONS_7 is empty there and fromJSON('') fails the whole run before build-and-test starts.
      # Use the variable when it is set, otherwise test the latest build of each Lucee line through
      # a version query (script-runner resolves it), so fork PRs are tested too.
      - name: Resolve Lucee test matrix
        id: lucee-matrix
        env:
          TEST_VERSIONS: ${{ vars.LUCEE_TEST_VERSIONS_7 }}
          FALLBACK_LINES: "7.0 7.1 8.0"
        run: |
          set -euo pipefail
          if [[ -n "${TEST_VERSIONS// }" ]] && echo "$TEST_VERSIONS" | jq -e 'type == "array" and length > 0' > /dev/null; then
            echo "Using vars.LUCEE_TEST_VERSIONS_7"
            MATRIX=$(echo "$TEST_VERSIONS" | jq -c '.')
          else
            echo "::notice::vars.LUCEE_TEST_VERSIONS_7 is not available (fork pull request?), testing the latest build of: ${FALLBACK_LINES}"
            MATRIX=$(printf '%s\n' $FALLBACK_LINES | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({version: (. + "/all/light"), query: (. + "/all/light"), branch: .})')
          fi
          # artifact names cannot contain "/", so give every entry a label
          MATRIX=$(echo "$MATRIX" | jq -c 'map(. + {label: ((.version // .query) | gsub("[^A-Za-z0-9._-]"; "-"))})')
          echo "Lucee test matrix: ${MATRIX}"
          echo "MATRIX=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee_matrix) }}
        # test runtime: Java 21 and the current LTS 25
        java: ['21', '25']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lucee
          MYSQL_USER: lucee
          MYSQL_PASSWORD: lucee
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      sql-server:
        image: ghcr.io/lucee/mssql-server:test-mirror
        env:
          MSSQL_PID: Express
          ACCEPT_EULA: Y
          SA_PASSWORD: Lucee!1433
        ports:
          - 1433:1433
        options: --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P ${SA_PASSWORD} -Q 'SELECT 1' || exit 1"  --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lucee
          POSTGRES_USER: lucee
          POSTGRES_PASSWORD: lucee
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lucee"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # A release run builds the version with -SNAPSHOT removed, the same one deploy publishes.
      - name: Set the version for this run
        if: needs.setup.outputs.release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>hibernate-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY

      - name: Build and Install with Maven
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hibernate-lex-${{ matrix.lucee.label }}-java${{ matrix.java }}
          path: |
            target/*.lex
            !target/*.lite.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee
          ref: ${{ matrix.lucee.branch }}

      - name: Set up JDK ${{ matrix.java }} for the test runtime
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/
          execute: /test/bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: orm
          testAdditional: ${{ github.workspace }}/tests
          testServices: mysql,mssql,postgres
          MYSQL_SERVER: localhost
          MYSQL_USERNAME: lucee
          MYSQL_PASSWORD: lucee
          MYSQL_PORT: 3306
          MYSQL_DATABASE: lucee
          MSSQL_SERVER: localhost
          MSSQL_USERNAME: sa
          MSSQL_PASSWORD: Lucee!1433
          MSSQL_PORT: 1433
          MSSQL_DATABASE: master
          POSTGRES_SERVER: localhost
          POSTGRES_USERNAME: lucee
          POSTGRES_PASSWORD: lucee
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: lucee

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, build-and-test]
    # pull requests (often from forks) get no secrets, so they only build and test
    if: always() && needs.build-and-test.result == 'success' && needs.setup.outputs.publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      # Maven 3.10.0 (default on the GitHub runners since 2026-10-04) puts maven-metadata-local.xml into the staging
      # folder of the Central bundle, which Maven Central rejects ("Bundle has content that does NOT have a .pom file").
      # Maven 3.9.16 does not, so use that one for the deploy until the central-publishing plugin handles this.
      - name: Use Maven 3.9.16 for the deploy
        run: |
          MVN_VERSION=3.9.16
          BASE=https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "$BASE/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$(curl -fsSL "$BASE/apache-maven-$MVN_VERSION-bin.tar.gz.sha512")  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Set the version for this run
        if: needs.setup.outputs.release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>hibernate-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot ${VERSION} on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy --settings maven-settings.xml
          elif [[ "$VERSION" =~ -(RC|BETA|ALPHA)$ ]]; then
            # pre-releases are not published to Maven Central, only to S3 (s3 job below)
            echo "------- Maven Install (signed) ${VERSION} on ${{ github.event_name }}, S3 only -------";
            mvn -B -e -f pom.xml clean install -DperformRelease=true --settings maven-settings.xml
          else
            echo "------- Maven Deploy release ${VERSION} on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # everything the S3 upload needs (LDEV-6568): full and lite .lex plus the flattened POM
      - name: Upload artifact for S3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hibernate-s3
          include-hidden-files: true
          path: |
            target/*.lex
            .flattened-pom.xml

  # LDEV-6736: publish every final, ALPHA, BETA and RC build as a GitHub release with its .lex files attached,
  # so ext.lucee.org can redirect downloads to GitHub releases (LDEV-6511). -SNAPSHOT builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central or S3 upload.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, deploy]
    if: >-
      always() && needs.deploy.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the same files the S3 job uploads (built by the deploy job with the published version)
      - name: Download published extension
        uses: actions/download-artifact@v4
        with:
          name: hibernate-s3
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (7.3.2.1 or 7.3.2.1-RC), created on this commit
          # if it does not exist yet. ALPHA/BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi

  # upload the published build to the Maven folders, LDEV-6568.
  # Cut-off rules (SNAPSHOTs stop on 2027-03-01) live in the called workflow.
  # Finals and SNAPSHOTs are also on Central / the snapshot repo; RC, BETA and ALPHA are only here.
  # secrets: inherit passes the org secrets S3_ACCESS_ID_DOWNLOAD and S3_SECRET_KEY_DOWNLOAD.
  # The called workflow warns and skips when those secrets are not available to this repo.
  s3:
    needs: [setup, deploy]
    if: always() && needs.deploy.result == 'success' && needs.setup.outputs.publish == 'true'
    uses: lucee/lucee/.github/workflows/extension-s3-upload.yml@7.1
    with:
      artifact-name: hibernate-s3
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # After a release deploy, or a SNAPSHOT deploy on a push, commit the next -SNAPSHOT.
  # No loop: the push uses the workflow token, which does not start another workflow run,
  # and runs started by github-actions[bot] or with the bump message are skipped anyway.
  bump:
    runs-on: ubuntu-latest
    needs: [setup, deploy, s3]
    if: >-
      always() && needs.deploy.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && (needs.s3.result == 'success' || needs.s3.result == 'skipped')
      && (needs.setup.outputs.release == 'true'
        || (github.event_name == 'push'
          && startsWith(github.ref, 'refs/heads/')
          && endsWith(needs.setup.outputs.version, '-SNAPSHOT')
          && github.actor != 'github-actions[bot]'
          && !startsWith(github.event.head_commit.message, 'Set version to ')
          && !contains(github.event.head_commit.message, '[skip ci]')))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bump to the next SNAPSHOT
        env:
          NEXT_VERSION: ${{ needs.setup.outputs.next_version }}
          DEPLOYED_VERSION: ${{ needs.setup.outputs.version }}
          IS_RELEASE: ${{ needs.setup.outputs.release }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" != "true" ]]; then
            # push: bump from the version on the branch tip, only if nobody bumped it since this deploy
            CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
            if [[ "$CURRENT" != "$DEPLOYED_VERSION" ]]; then
              echo "Branch is at ${CURRENT}, deployed ${DEPLOYED_VERSION}; already bumped, nothing to do"
              exit 0
            fi
            BASE="${CURRENT%-SNAPSHOT}"
            if ! [[ "$BASE" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
              echo "::warning::[${CURRENT}] is not a 4-part SNAPSHOT version, not bumping"
              exit 0
            fi
            NEXT_VERSION="${BASE%.*}.$((10#${BASE##*.} + 1))-SNAPSHOT"
            echo "Push run: bump pom.xml from ${CURRENT} to ${NEXT_VERSION}"
          fi
          if [[ -z "$NEXT_VERSION" ]]; then
            echo "::error::next version was not resolved"
            exit 1
          fi
          python3 - "$NEXT_VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>hibernate-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --cached --quiet; then
            echo "pom.xml already at ${NEXT_VERSION}"
            exit 0
          fi
          git commit -m "Set version to ${NEXT_VERSION}"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
