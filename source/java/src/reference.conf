// Lucee Hibernate ORM extension — Caffeine JCache defaults.
// Overlays caffeine-jcache's own reference.conf. Concrete values match the EHCache 2
// defaults this extension shipped before Hibernate 7.3 (10000 entries, 120s TTL/TTI),
// so existing user behaviour is preserved at-rest.
//
// Per-region overrides: drop your own application.conf onto the classpath with entries
// under `caffeine.jcache.caches.<regionName>` to tune individual cache regions.
caffeine.jcache.default {
  policy.maximum.size = 10000
  policy.eager-expiration {
    after-write = "120s"
    after-access = "120s"
  }
}
